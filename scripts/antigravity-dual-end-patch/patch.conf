# =============================================================================
# antigravity-dual-end-patch / patch.conf（配置模板）
# 由 patch.sh 以 source 方式加载；仅放字面量，禁止在此执行命令替换。
# 被 source 时以下数组会覆盖脚本内同名空数组。
# =============================================================================

# ---------------------------------------------------------------------------
# PATCH_FILES: 需要打补丁的文件规格
#   格式（用 | 分隔，共 4 段）:
#     source_rel|target_rel|role|purpose
#   source_rel : 相对 WORKTREE_ROOT 的“已打好补丁的构建产物”
#   target_rel : 相对 PLUGIN_DIR 的“安装目标”
#   role       : primary（首要目标，缺失则 regen-manifest 直接失败）| consistency
#   purpose    : 用途说明
#
# 【关键】host entry = dist/index.js（dsh-plugin.json -> facets.host.entry）。
# esbuild 会把所有 src 内联进这个 bundle，实际运行的就是它。
# 因此 primary 必须是 dist/index.js；dist/acp/** 只是 tsc 逐文件产物，
# 仅作一致性/其他消费者使用，按需在源码构建完成后追加。
# ---------------------------------------------------------------------------
PATCH_FILES=(
  'packages/plugin/dist/index.js|dist/index.js|primary|host entry（esbuild bundle，含 .gemini/antigravity-cli 硬编码；双端补丁的核心目标）'
  # 构建完成后可追加，例如：
  # 'packages/plugin/dist/acp/transcript-loader.js|dist/acp/transcript-loader.js|consistency|双端 transcript 加载器 tsc 产物'
  # 'packages/plugin/dist/acp/transcript-watcher.js|dist/acp/transcript-watcher.js|consistency|双端 transcript 监听器 tsc 产物'
)

# ---------------------------------------------------------------------------
# NATIVE_MARKERS: 上游“原生支持”特征 —— 只有上游把该能力做进产品才会出现的字符串。
#
# 【严禁】填我们补丁自己会引入的符号（例如双端目录常量、双端同步函数名）。
# 否则补丁一旦在位、manifest 又恰好不同步，就会被误判成 NATIVE，apply 反而拒绝。
#
# 【lead 定稿 2026-11-18】当前 bundle 中这两个字符串出现次数均为 0；
# 只有上游原生支持 agy 主命令 --app-data-dir / 自有 app-data-dir 环境变量时才会出现。
# 我们的补丁不会引入它们，因此不会自打脸误判 NATIVE。
# 判定门槛：必须“旧 ANCHORS 仍在 + 命中本 marker”才判 NATIVE。
# ---------------------------------------------------------------------------
NATIVE_MARKERS=(
  '--app-data-dir'
  'AGY_APP_DATA_DIR'
)

# ---------------------------------------------------------------------------
# PATCH_MARKERS: 我们补丁独有的 marker —— 上游绝不会有，只有本补丁会注入。
# 源码代理需在补丁里把它写进 dist/index.js（常量或注释均可），例如：
#   const DSH_AGY_DUAL_END_PATCH_V1 = true;   // 或 // DSH_AGY_DUAL_END_PATCH_V1
# 用途：
#   1) APPLIED 交叉验证：checksum 命中且该 marker 在位 => 确认补丁真的生效；
#   2) 防止自打补丁被误判：checksum 未命中但 marker 在位 => 一律 STALE 并要求
#      regen-manifest，绝不判 NATIVE/CONFLICT 让人误以为要放弃补丁。
# ---------------------------------------------------------------------------
PATCH_MARKERS=(
  'DSH_AGY_DUAL_END_PATCH_V1'
)

# ---------------------------------------------------------------------------
# ANCHORS: 目标文件必须包含的“结构锚点”。
# 非 APPLIED 状态且缺失任一 anchor => 判定 CONFLICT（结构已变，补丁基础不存在）。
# 注意：anchor 只在“未匹配补丁 checksum”时检查，因此补丁改写了该字符串也不影响
# 已应用文件的 APPLIED 判定。
# 【待 lead 定稿】请确认这些字符串在“未打补丁的上游文件”中稳定存在。
# ---------------------------------------------------------------------------
ANCHORS=(
  '.gemini/antigravity-cli'
)
