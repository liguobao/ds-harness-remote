plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'io.github.liguobao.dshremote'
version = '1.0.0'

android {
  namespace 'io.github.liguobao.dshremote.transport'
  defaultConfig {
    versionCode 1
    versionName '1.0.0'
  }
}

dependencies {
  implementation 'com.facebook.react:react-android'
  implementation project(':react-native-webrtc')
}
