- insert:
    - id: ds-harness-remote
      name: 'ds-harness-remote'
      # dsh-TUI needs a scoped entry with explicit command/scene injects.
      # Keep this ordinary Desktop entry inactive when that front door exists.
      disabled: !!js >-
        [...ctx.loader.entries()].some(entry =>
          (entry.options.id === 'dsh-tui' || entry.options.name === '@deepseek-harness-tui/dsh-tui')
          && !entry.disabled
        )
      config:
        enabled: true
        role: host
        serverUrl: https://dsh.r2049.cn
        codex:
          enabled: true
          binary: codex
    - id: ds-harness-remote-tui
      name: 'ds-harness-remote'
      # The TUI command registry is the only required terminal service. The
      # completion tree and full-screen scene registries are optional seams;
      # the plugin resolves them with ctx.get() and falls back to inline
      # status/CLI login when an older or partial TUI profile omits them.
      disabled: !!js >-
        ![...ctx.loader.entries()].some(entry =>
          (entry.options.id === 'dsh-tui' || entry.options.name === '@deepseek-harness-tui/dsh-tui')
          && !entry.disabled
        )
      inject: [settings, typertGateway, commands]
      config:
        enabled: true
        role: host
        serverUrl: https://dsh.r2049.cn
        codex:
          enabled: true
          binary: codex
