name: HarmonyOS HAP

# SDK jobs run only when a maintainer dispatches reviewed code or creates a release tag.
# Do not run untrusted fork pull requests on a self-hosted runner.
on:
  workflow_dispatch:
    inputs:
      build_mode:
        description: Build mode
        type: choice
        options: [release, debug]
        default: release
      signed:
        description: Sign with repository secrets (trusted code only)
        type: boolean
        default: false
  push:
    tags:
      - 'harmony-v*'

permissions:
  contents: read

jobs:
  hap:
    name: Build HAP with HarmonyOS SDK
    runs-on: [self-hosted, harmonyos]
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/harmony
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Verify the HarmonyOS toolchain
        run: |
          command -v hvigorw
          command -v ohpm
          hvigorw --version
          node --version

      - name: Install HarmonyOS dependencies
        run: ohpm install --all

      - name: Configure unsigned validation build
        if: github.event_name == 'workflow_dispatch' && !inputs.signed
        run: node scripts/inject-signing.mjs --unsigned

      - name: Inject release signing material
        if: github.event_name == 'push' || inputs.signed
        env:
          HARMONY_SIGNING_STORE_B64: ${{ secrets.HARMONY_SIGNING_STORE_B64 }}
          HARMONY_SIGNING_STORE_PASSWORD: ${{ secrets.HARMONY_SIGNING_STORE_PASSWORD }}
          HARMONY_SIGNING_KEY_ALIAS: ${{ secrets.HARMONY_SIGNING_KEY_ALIAS }}
          HARMONY_SIGNING_KEY_PASSWORD: ${{ secrets.HARMONY_SIGNING_KEY_PASSWORD }}
          HARMONY_SIGNING_CERT_B64: ${{ secrets.HARMONY_SIGNING_CERT_B64 }}
          HARMONY_SIGNING_PROFILE_B64: ${{ secrets.HARMONY_SIGNING_PROFILE_B64 }}
        run: |
          umask 077
          node scripts/inject-signing.mjs

      - name: Build HAP
        env:
          BUILD_MODE: ${{ inputs.build_mode || 'release' }}
        run: hvigorw --no-daemon assembleHap -p product=default -p buildMode="$BUILD_MODE"

      - name: Upload HAP artifact
        uses: actions/upload-artifact@v4
        with:
          name: harmony-hap
          path: apps/harmony/entry/build/default/outputs/default/*.hap
          if-no-files-found: error

      - name: Remove signing material and restore profile
        if: always()
        run: |
          git restore -- build-profile.json5
          rm -rf build/signing
