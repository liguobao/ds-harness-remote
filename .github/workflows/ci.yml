name: CI

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true

jobs:
  changes:
    name: Detect Android changes
    runs-on: ubuntu-latest
    outputs:
      android: ${{ steps.detect.outputs.android }}
      harmony: ${{ steps.detect.outputs.harmony }}
    steps:
      - name: Detect Android changes
        id: detect
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" != "pull_request" ]]; then
            echo "android=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          files=$(gh api --paginate "repos/$GH_REPO/pulls/$PR_NUMBER/files" --jq '.[].filename') || {
            echo "::error::Failed to list pull request files; cannot detect Android changes"
            exit 1
          }

          android=false
          while IFS= read -r file_path; do
            case "$file_path" in
              .github/workflows/ci.yml|apps/android/*|packages/client-core/*|packages/crypto/*|packages/protocol/*|packages/webrtc/*|package.json|pnpm-lock.yaml|pnpm-workspace.yaml)
                android=true
                break
                ;;
            esac
          done <<< "$files"

          echo "android=$android" >> "$GITHUB_OUTPUT"

          harmony=false
          while IFS= read -r file_path; do
            case "$file_path" in
              .github/workflows/ci.yml|.github/workflows/harmony*.yml|harmony/*|fixtures/crypto/*|packages/crypto/*|packages/protocol/*|pnpm-workspace.yaml)
                harmony=true
                break
                ;;
            esac
          done <<< "$files"

          echo "harmony=$harmony" >> "$GITHUB_OUTPUT"

  quality:
    name: Check, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.4

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.9.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace packages
        run: pnpm --filter './packages/**' -r build

      - name: Verify committed Plugin bundles
        run: git diff --exit-code -- packages/plugin/dist/index.js packages/plugin/dist/client.github.js

      - name: Check types
        run: pnpm -r check

      - name: Verify GitHub plugin bundle
        run: |
          node scripts/verify-dsh-plugin.mjs

      - name: Run tests
        run: pnpm -r test

      # The HarmonyOS client cannot be built on a GitHub-hosted runner (no HarmonyOS SDK),
      # but its hand-written Noise IK implementation is plain TypeScript and can be verified
      # against the repository's golden vectors here. See .github/workflows/harmony-hap.yml
      # for the signed HAP build that runs on a self-hosted runner.
      - name: Run HarmonyOS client crypto conformance
        run: pnpm exec vitest run harmony/tests

      # Android prebuild recompiles shared packages. Serialize workspace builds
      # so Plugin bundling cannot read dist files while tsc rewrites them.
      - name: Build workspace
        run: NODE_ENV=production pnpm --workspace-concurrency=1 -r build

      - name: Verify production Plugin bundles
        run: |
          git diff --exit-code -- packages/plugin/dist/index.js packages/plugin/dist/client.github.js
          node scripts/verify-dsh-plugin.mjs

      - name: Verify packed Host WebRTC fallback and installation closure
        run: node scripts/verify-packed-webrtc.mjs

  xfs-refresh:
    name: Test credential locks on XFS
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.4
      - uses: actions/setup-node@v7
        with:
          node-version: 24.9.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter './packages/**' -r build
      - name: Mount local XFS
        run: |
          sudo apt-get update
          sudo apt-get install -y xfsprogs
          truncate -s 512M "$RUNNER_TEMP/refresh-xfs.img"
          sudo mkfs.xfs -f "$RUNNER_TEMP/refresh-xfs.img"
          mkdir "$RUNNER_TEMP/refresh-xfs"
          sudo mount -o loop "$RUNNER_TEMP/refresh-xfs.img" "$RUNNER_TEMP/refresh-xfs"
          sudo chown "$(id -u):$(id -g)" "$RUNNER_TEMP/refresh-xfs"
          findmnt -T "$RUNNER_TEMP/refresh-xfs" -o FSTYPE
          touch "$RUNNER_TEMP/refresh-xfs/source"
          ln "$RUNNER_TEMP/refresh-xfs/source" "$RUNNER_TEMP/refresh-xfs/linked"
      - name: Run refresh and migration tests on XFS
        run: pnpm --dir packages/plugin exec vitest run tests/server-credentials.test.ts tests/identity-store.test.ts
        env:
          TMPDIR: ${{ runner.temp }}/refresh-xfs

  plugin-package:
    name: Package npm plugin
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.4

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.9.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace packages
        run: pnpm --filter './packages/**' -r build

      - name: Pack npm packages
        run: |
          mkdir -p artifacts/packages/root artifacts/packages/workspace
          pnpm pack --pack-destination "$GITHUB_WORKSPACE/artifacts/packages/root"

          for package_json in packages/*/package.json; do
            package_dir="${package_json%/package.json}"
            pnpm --dir "$package_dir" pack --pack-destination "$GITHUB_WORKSPACE/artifacts/packages/workspace"
          done

      - name: Upload npm packages
        uses: actions/upload-artifact@v7
        with:
          name: dsh-remote-packages-${{ github.sha }}
          path: artifacts/packages/**/*.tgz
          if-no-files-found: error
          retention-days: 14

      - name: Build browser extension
        run: NODE_ENV=production pnpm --dir apps/browser build

      - name: Package browser extension
        run: |
          mkdir -p artifacts/browser
          cd apps/browser
          zip -qr "$GITHUB_WORKSPACE/artifacts/browser/dsh-remote-browser-${GITHUB_SHA}.zip" \
            manifest.json popup.html styles.css media _locales dist

      - name: Upload browser extension
        uses: actions/upload-artifact@v7
        with:
          name: dsh-remote-browser-${{ github.sha }}
          path: artifacts/browser/dsh-remote-browser-${{ github.sha }}.zip
          if-no-files-found: error
          retention-days: 14

  server-image:
    name: Build Server container
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up QEMU for ARM64
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract container metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/server
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
            type=sha,prefix=sha-

      - name: Log in to GitHub Container Registry
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Server image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/server/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  android-apk:
    name: Package Android APK
    needs:
      - changes
      - quality
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.4

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.9.0
          cache: pnpm

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace packages
        run: pnpm --filter './packages/**' -r build

      - name: Check out Intelligent UI renderer source
        uses: actions/checkout@v7
        with:
          repository: dreamfarer-space/deepseek-harness-intelligent-ui
          # Pinned upstream PR #82 merge commit; update only after auditing the new artifact.
          ref: f3735efffd823f8c34817f4e8554743ac3276225
          path: .deps/deepseek-harness-intelligent-ui

      - name: Verify pinned Intelligent UI renderer
        run: |
          test "$(git -C .deps/deepseek-harness-intelligent-ui rev-parse HEAD)" = "f3735efffd823f8c34817f4e8554743ac3276225" || { echo '::error::Unexpected renderer source commit'; exit 1; }
          test "$(git -C .deps/deepseek-harness-intelligent-ui hash-object renderer/renderer.js)" = "ebac4a4c2199383458d4e1fa2121be0e6043c5c0" || { echo '::error::Unexpected renderer file content'; exit 1; }

      - name: Bundle local Android renderers
        env:
          DSH_INTELLIGENT_UI_RENDERER_BUNDLE: ${{ github.workspace }}/.deps/deepseek-harness-intelligent-ui/renderer/renderer.js
          DSH_REQUIRE_INTELLIGENT_UI: 'true'
        run: pnpm --dir apps/android run build:renderers

      - name: Verify bundled Android renderers
        env:
          DSH_REQUIRE_INTELLIGENT_UI: 'true'
        run: node apps/android/scripts/verify-intelligent-ui-renderer.mjs

      - name: Generate Android project
        run: pnpm --dir apps/android exec expo prebuild --platform android --no-install

      - name: Build release APK
        env:
          NODE_ENV: production
        run: |
          chmod +x apps/android/android/gradlew
          apps/android/android/gradlew \
            -p apps/android/android \
            :app:assembleRelease \
            --no-daemon \
            --build-cache \
            -PreactNativeArchitectures=${{ github.event_name == 'pull_request' && 'arm64-v8a' || 'armeabi-v7a,arm64-v8a' }}

      - name: Stage APK
        run: |
          mkdir -p artifacts/android
          cp apps/android/android/app/build/outputs/apk/release/app-release.apk \
            artifacts/android/dsh-remote-android.apk

      - name: Upload Android APK
        uses: actions/upload-artifact@v7
        with:
          name: dsh-remote-android-${{ github.sha }}
          path: artifacts/android/dsh-remote-android.apk
          if-no-files-found: error
          retention-days: 14
