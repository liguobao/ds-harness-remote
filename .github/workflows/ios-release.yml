name: iOS Release

# Signed iOS archive and TestFlight upload.
#
# Separate from release.yml because it needs a macOS runner and Apple
# credentials. It waits for release.yml's version validation to pass, so a tag
# whose versions disagree never reaches a signing step.
#
# Required repository configuration (Settings -> Secrets and variables -> Actions):
#
#   Variables
#     IOS_TEAM_ID                     Apple Developer team, e.g. A1B2C3D4E5
#
#   Secrets
#     APP_STORE_CONNECT_ISSUER_ID     App Store Connect API key issuer UUID
#     APP_STORE_CONNECT_KEY_ID        App Store Connect API key id (10 chars)
#     APP_STORE_CONNECT_PRIVATE_KEY   Contents of the .p8 key, including the
#                                     BEGIN/END PRIVATE KEY lines
#
# The API key covers both signing (-allowProvisioningUpdates) and the upload, so
# no certificate or provisioning profile needs to be stored in this repository.
# Nothing here is readable by pull requests: this workflow only runs on tags in
# this repository, and forks cannot access these secrets.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      ref:
        description: 'Tag to build, e.g. v0.6.5'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ios-release-${{ github.ref }}
  cancel-in-progress: false

env:
  CI: true

jobs:
  testflight:
    name: Archive and upload to TestFlight
    runs-on: macos-latest
    timeout-minutes: 90
    # A fork builds under its own Apple account, so this is not restricted to
    # the upstream repository. It needs the four values below; without them the
    # first step fails with an explicit list of what is missing.
    #
    # The protected environment exists only upstream. Referencing it from a fork
    # that has not created it would fail the job before any step runs, so it is
    # applied conditionally.
    environment: ${{ github.repository == 'liguobao/ds-harness-remote' && 'ios-release' || '' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Require signing configuration
        env:
          TEAM_ID: ${{ vars.IOS_TEAM_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          missing=()
          [[ -n "$TEAM_ID" ]] || missing+=(IOS_TEAM_ID)
          [[ -n "$ISSUER_ID" ]] || missing+=(APP_STORE_CONNECT_ISSUER_ID)
          [[ -n "$KEY_ID" ]] || missing+=(APP_STORE_CONNECT_KEY_ID)
          [[ -n "$PRIVATE_KEY" ]] || missing+=(APP_STORE_CONNECT_PRIVATE_KEY)
          if (( ${#missing[@]} )); then
            echo "::error::Missing iOS signing configuration: ${missing[*]}"
            exit 1
          fi

      # The signing build needs a current Xcode for Expo SDK 57. Take the
      # runner default rather than pinning a path that may not exist on a
      # future image; an archive fails loudly if the toolchain is too old.
      - name: Show Xcode toolchain
        run: xcodebuild -version

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.4

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.9.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace packages
        run: pnpm --filter './packages/**' -r build

      - name: Check out Intelligent UI renderer source
        uses: actions/checkout@v7
        with:
          repository: dreamfarer-space/deepseek-harness-intelligent-ui
          # Pinned upstream PR #82 merge commit; update only after auditing the new artifact.
          ref: f3735efffd823f8c34817f4e8554743ac3276225
          path: .deps/deepseek-harness-intelligent-ui

      - name: Verify pinned Intelligent UI renderer
        run: |
          test "$(git -C .deps/deepseek-harness-intelligent-ui rev-parse HEAD)" = "f3735efffd823f8c34817f4e8554743ac3276225" || { echo '::error::Unexpected renderer source commit'; exit 1; }
          test "$(git -C .deps/deepseek-harness-intelligent-ui hash-object renderer/renderer.js)" = "ebac4a4c2199383458d4e1fa2121be0e6043c5c0" || { echo '::error::Unexpected renderer file content'; exit 1; }

      - name: Bundle local renderers
        env:
          DSH_INTELLIGENT_UI_RENDERER_BUNDLE: ${{ github.workspace }}/.deps/deepseek-harness-intelligent-ui/renderer/renderer.js
          DSH_REQUIRE_INTELLIGENT_UI: 'true'
        run: pnpm --filter @dsh-remote/app-core run build:renderers

      - name: Verify bundled renderers
        env:
          DSH_REQUIRE_INTELLIGENT_UI: 'true'
        run: node packages/app-core/scripts/verify-intelligent-ui-renderer.mjs

      - name: Generate iOS project
        env:
          APPLE_TEAM_ID: ${{ vars.IOS_TEAM_ID }}
        run: pnpm --dir apps/ios exec expo prebuild --platform ios --no-install

      - name: Install CocoaPods
        env:
          EXPO_USE_PRECOMPILED_MODULES: '1'
        run: pod install --project-directory=apps/ios/ios

      - name: Pre-build ExpoModulesJSI xcframework
        working-directory: apps/ios
        run: |
          JSI_PACKAGE="$(node -p "require('path').dirname(require.resolve('expo-modules-jsi/package.json', { paths: [require('path').dirname(require.resolve('expo/package.json'))] }))")"
          PODS_ROOT="$PWD/ios/Pods" "${JSI_PACKAGE}/apple/scripts/build-xcframework.sh"

      - name: Write App Store Connect API key
        env:
          PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
        run: |
          mkdir -p "$RUNNER_TEMP/private_keys"
          printf '%s\n' "$PRIVATE_KEY" > "$RUNNER_TEMP/private_keys/AuthKey_${KEY_ID}.p8"
          chmod 600 "$RUNNER_TEMP/private_keys/AuthKey_${KEY_ID}.p8"

      - name: Archive
        working-directory: apps/ios/ios
        env:
          TEAM_ID: ${{ vars.IOS_TEAM_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
        run: |
          set -o pipefail
          xcodebuild \
            -workspace DSHRemote.xcworkspace \
            -scheme DSHRemote \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/DSHRemote.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyIssuerID "$ISSUER_ID" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyPath "$RUNNER_TEMP/private_keys/AuthKey_${KEY_ID}.p8" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            archive \
            | xcbeautify

      - name: Write ExportOptions.plist
        env:
          TEAM_ID: ${{ vars.IOS_TEAM_ID }}
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
            <key>destination</key><string>export</string>
          </dict>
          </plist>
          PLIST

      - name: Export IPA
        working-directory: apps/ios/ios
        env:
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
        run: |
          set -o pipefail
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/DSHRemote.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyIssuerID "$ISSUER_ID" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyPath "$RUNNER_TEMP/private_keys/AuthKey_${KEY_ID}.p8" \
            | xcbeautify

      - name: Upload to TestFlight
        env:
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
        run: |
          IPA="$(find "$RUNNER_TEMP/export" -name '*.ipa' -maxdepth 1 | head -1)"
          [[ -n "$IPA" ]] || { echo '::error::No IPA produced'; exit 1; }
          # API_PRIVATE_KEYS_DIR is where altool looks for AuthKey_<KEY_ID>.p8.
          API_PRIVATE_KEYS_DIR="$RUNNER_TEMP/private_keys" \
            xcrun altool --upload-app -f "$IPA" -t ios \
              --apiKey "$KEY_ID" \
              --apiIssuer "$ISSUER_ID"

      - name: Remove signing material
        if: always()
        run: rm -rf "$RUNNER_TEMP/private_keys"

      - name: Upload build log artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ios-release-logs-${{ github.sha }}
          path: |
            apps/ios/ios/build/Logs/**
          if-no-files-found: ignore
          retention-days: 7
