name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CI: true

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.4

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          # npm trusted publishing requires the npm version bundled with Node 24.
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
          cache: pnpm

      - name: Validate version tag
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises'

          const readJson = async (path) => JSON.parse(await readFile(path, 'utf8'))
          const root = await readJson('package.json')
          const plugin = await readJson('packages/plugin/package.json')
          const tui = await readJson('packages/tui/package.json')
          const androidPackage = await readJson('apps/android/package.json')
          const androidApp = await readJson('apps/android/app.json')
          const versions = new Set([root.version, plugin.version, tui.version, androidPackage.version, androidApp.expo?.version])
          if (tui.dependencies['ds-harness-remote'] !== `workspace:${plugin.version}`) {
            throw new Error('TUI must depend on the matching Remote workspace version.')
          }
          const expectedTag = `v${plugin.version}`

          if (versions.size !== 1) {
            throw new Error(`Release versions do not match: ${[...versions].join(', ')}`)
          }
          const androidBuild = androidApp.expo?.android?.versionCode
          const iosBuild = androidApp.expo?.ios?.buildNumber
          if (androidBuild === undefined || iosBuild === undefined || String(androidBuild) !== String(iosBuild)) {
            throw new Error('Android versionCode and iOS buildNumber must match for a release.')
          }
          if (process.env.GITHUB_REF_NAME !== expectedTag) {
            throw new Error(`Expected tag ${expectedTag}, received ${process.env.GITHUB_REF_NAME}`)
          }
          NODE

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check types
        run: |
          pnpm --filter './packages/**' -r build
          pnpm -r check

      - name: Run tests
        run: pnpm -r test

      # Android prebuild recompiles shared packages. Serialize workspace builds
      # so Plugin bundling cannot read dist files while tsc rewrites them.
      - name: Build workspace
        run: NODE_ENV=production pnpm --workspace-concurrency=1 -r build

      - name: Verify production Plugin bundles
        run: |
          git diff --exit-code -- packages/plugin/dist/index.js packages/plugin/dist/client.github.js
          node scripts/verify-dsh-plugin.mjs

      - name: Pack npm plugin
        run: |
          mkdir -p release-assets
          pnpm --dir packages/plugin pack --pack-destination "$GITHUB_WORKSPACE/release-assets"

      - name: Pack npm TUI
        run: pnpm --dir packages/tui pack --pack-destination "$GITHUB_WORKSPACE/release-assets"

      - name: Stage release assets
        run: |
          cd release-assets
          sha256sum *.tgz > SHA256SUMS.txt

      - name: Build and package browser extension
        run: |
          NODE_ENV=production pnpm --dir apps/browser build
          mkdir -p release-assets/browser-extension
          cd apps/browser
          zip -qr "$GITHUB_WORKSPACE/release-assets/dsh-remote-browser-${GITHUB_REF_NAME}.zip" \
            manifest.json popup.html styles.css media _locales dist

      - name: Update release checksums
        run: |
          cd release-assets
          sha256sum *.tgz *.zip > SHA256SUMS.txt

      - name: Publish npm plugin
        id: npm-publish
        continue-on-error: true
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          PACKAGE_NAME="$(node -p "JSON.parse(require('fs').readFileSync('packages/plugin/package.json', 'utf8')).name")"
          echo "Checking if version already exists on npm..."
          if npm view "$PACKAGE_NAME"@"$VERSION" >/dev/null 2>&1; then
            echo "Version already exists on npm, skip publish."
          else
            (cd packages/plugin && npm publish)
          fi

      - name: Report npm publish failure
        if: steps.npm-publish.outcome == 'failure'
        run: echo '::warning::npm publish failed; GitHub Packages, GitHub Release, and Android APK publication will continue. Retry this tag after refreshing npm registry credentials.'

      - name: Publish npm TUI
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if npm view "ds-harness-remote@$VERSION" >/dev/null 2>&1; then
            if npm view "ds-harness-remote-tui@$VERSION" >/dev/null 2>&1; then
              echo "TUI version already exists on npm, skip publish."
            else
              npm publish "release-assets/ds-harness-remote-tui-$VERSION.tgz" --access public --provenance
            fi
          else
            echo '::error::Publish ds-harness-remote before its matching TUI package.'
            exit 1
          fi

      - name: Publish GitHub Packages plugin
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          PACKAGE_SCOPE="$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          PACKAGE_NAME="@${PACKAGE_SCOPE}/ds-harness-remote"
          NPM_CONFIG_USERCONFIG="$RUNNER_TEMP/github-packages.npmrc"
          export NPM_CONFIG_USERCONFIG PACKAGE_NAME

          printf '//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}\n' > "$NPM_CONFIG_USERCONFIG"
          printf '@%s:registry=https://npm.pkg.github.com\n' "$PACKAGE_SCOPE" >> "$NPM_CONFIG_USERCONFIG"

          echo "Checking if version already exists on GitHub Packages..."
          if npm view "$PACKAGE_NAME@$VERSION" --registry=https://npm.pkg.github.com >/dev/null 2>&1; then
            echo "Version already exists on GitHub Packages, skip publish."
            exit 0
          fi

          GITHUB_PACKAGE_DIR="$RUNNER_TEMP/github-package"
          mkdir -p "$GITHUB_PACKAGE_DIR"
          tar -xzf "release-assets/ds-harness-remote-$VERSION.tgz" -C "$GITHUB_PACKAGE_DIR"

          node --input-type=module <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises'

          const packageJsonPath = `${process.env.RUNNER_TEMP}/github-package/package/package.json`
          const manifest = JSON.parse(await readFile(packageJsonPath, 'utf8'))
          manifest.name = process.env.PACKAGE_NAME
          manifest.publishConfig = {
            ...(manifest.publishConfig ?? {}),
            registry: 'https://npm.pkg.github.com',
            provenance: false,
          }
          await writeFile(packageJsonPath, `${JSON.stringify(manifest, null, 2)}\n`)
          NODE

          npm publish "$GITHUB_PACKAGE_DIR/package" --registry=https://npm.pkg.github.com --access public

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          files: release-assets/*
          fail_on_unmatched_files: true
          body_path: .github/release-notes.md
          generate_release_notes: false

  android-apk:
    name: Build and attach Android APK
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.4

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.9.0
          cache: pnpm

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace packages
        run: pnpm --filter './packages/**' -r build

      - name: Check out Intelligent UI renderer source
        uses: actions/checkout@v6
        with:
          repository: dreamfarer-space/deepseek-harness-intelligent-ui
          # Pinned upstream PR #82 merge commit; update only after auditing the new artifact.
          ref: f3735efffd823f8c34817f4e8554743ac3276225
          path: .deps/deepseek-harness-intelligent-ui

      - name: Verify pinned Intelligent UI renderer
        run: |
          test "$(git -C .deps/deepseek-harness-intelligent-ui rev-parse HEAD)" = "f3735efffd823f8c34817f4e8554743ac3276225" || { echo '::error::Unexpected renderer source commit'; exit 1; }
          test "$(git -C .deps/deepseek-harness-intelligent-ui hash-object renderer/renderer.js)" = "ebac4a4c2199383458d4e1fa2121be0e6043c5c0" || { echo '::error::Unexpected renderer file content'; exit 1; }

      - name: Bundle local Android renderers
        env:
          DSH_INTELLIGENT_UI_RENDERER_BUNDLE: ${{ github.workspace }}/.deps/deepseek-harness-intelligent-ui/renderer/renderer.js
          DSH_REQUIRE_INTELLIGENT_UI: 'true'
        run: pnpm --dir apps/android run build:renderers

      - name: Verify bundled Android renderers
        env:
          DSH_REQUIRE_INTELLIGENT_UI: 'true'
        run: node apps/android/scripts/verify-intelligent-ui-renderer.mjs

      - name: Generate Android project
        run: pnpm --dir apps/android exec expo prebuild --platform android --no-install

      - name: Build release APK
        env:
          NODE_ENV: production
        run: |
          chmod +x apps/android/android/gradlew
          apps/android/android/gradlew \
            -p apps/android/android \
            :app:assembleRelease \
            --no-daemon \
            --build-cache \
            -PreactNativeArchitectures=armeabi-v7a,arm64-v8a

      - name: Stage APK
        run: |
          mkdir -p artifacts/android
          cp apps/android/android/app/build/outputs/apk/release/app-release.apk \
            "artifacts/android/dsh-remote-android-${{ github.ref_name }}.apk"

      - name: Attach APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: artifacts/android/dsh-remote-android-${{ github.ref_name }}.apk
          fail_on_unmatched_files: true
