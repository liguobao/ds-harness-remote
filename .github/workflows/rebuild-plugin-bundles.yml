name: Rebuild committed Plugin bundles

on:
  push:
    branches:
      - fix/allow-private-http-server-url
    paths:
      - .github/workflows/rebuild-plugin-bundles.yml

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: fix/allow-private-http-server-url

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.4

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace packages
        run: pnpm --filter './packages/**' -r build

      - name: Commit rebuilt bundles and remove temporary workflow
        run: |
          rm .github/workflows/rebuild-plugin-bundles.yml
          git add packages/plugin/dist/index.js packages/plugin/dist/client.github.js .github/workflows/rebuild-plugin-bundles.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'build(plugin): refresh committed bundles'
          git push origin HEAD:fix/allow-private-http-server-url
