name: 💡 功能需求 (Feature Request)
description: 为 ds-harness-remote 提出新特性或体验改进建议
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        感谢帮助构想 ds-harness-remote 的未来！请从具体的痛点、使用场景或生态联动切入描述需求。

  - type: dropdown
    id: area
    attributes:
      label: 涉及模块 (Affected area)
      description: 该功能主要改进哪个部分？
      options:
        - "Android App (apps/android)"
        - "Web 客户端 / 浏览器端 (apps/browser)"
        - "中继 / 信令服务端 (apps/server)"
        - "VS Code 插件 (apps/vscode)"
        - "DSH 桌面插件 (packages/plugin)"
        - "联动插件与生态扩展 (dsh-go / ds-bot / intelligent ui 等)"
        - "通信与核心协议 (client-core / webrtc / protocol)"
        - "文档与开发者体验 (docs / dx)"
        - "整体架构与其它"
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: 现有痛点或需求背景 (Problem / Motivation)
      description: 当前有什么操作是不便甚至无法完成的？在什么场景下会遇到？（如涉及与其他插件联动请具体说明）
      placeholder: 请描述实际的工作流障碍，而非仅列出技术名词。
    validations:
      required: true

  - type: textarea
    id: desired-outcome
    attributes:
      label: 期望达到的效果 (Desired outcome)
      description: 新特性实现后，用户将可以怎样操作？带来什么收益？
    validations:
      required: true

  - type: textarea
    id: proposed-solution
    attributes:
      label: 建议的实现方案 (Proposed solution)
      description: 如果你已有具体的思路、架构设计、通信消息或 API 想法，请在此说明（选填）。

  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案或临时变通方法 (Alternatives considered)
      description: 目前是否有其他替代做法？为什么现有的变通手段不够好？

  - type: textarea
    id: additional-context
    attributes:
      label: 补充说明与草图 (Additional context)
      description: 可附上交互线框图、参考项目链接等。请确保已脱敏私有数据。

  - type: checkboxes
    id: validations
    attributes:
      label: 提交前确认 (Before submitting)
      options:
        - label: 我已检索过既有 Issue 和 PR，确认没有重复或已被讨论过的提议。
          required: true
        - label: 我已阅读并确认此需求属于本项目或所支持的插件联动范畴。
          required: true
        - label: 内容中不包含任何敏感信息或私有数据。
          required: true
